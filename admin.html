<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-I1THEewq4FwLI0oTTc68IHmBoE9HrHDW9c661sWuzX4=' https://cdn.jsdelivr.net https://apis.google.com https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://apis.google.com; frame-src https://zonapronostici-bf68d.firebaseapp.com https://accounts.google.com https://apis.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">

<style>
:root{--bg:#070707;--s1:#111;--s2:#1a1a1a;--line:#242424;--line2:#333;--fg:#f4f4f4;--muted:#9a9a9a;--or:#ff6b00;--or2:#ff8a2a;--ok:#3ddc84;--ko:#ff6b6b;--y:#ffc400}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--or2)}button{font:inherit}
.top{position:sticky;top:0;z-index:5;background:rgba(7,7,7,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.02em;text-decoration:none;color:var(--fg)}.brand em{color:var(--or);font-style:normal}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.12em;font-weight:800}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}.tabs button{background:var(--s1);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:13px}
.tabs button[aria-pressed=true]{color:var(--fg);border-color:var(--or);background:rgba(255,107,0,.12)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:18px}
h2{margin:0 0 4px;font-size:22px}h3{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px}.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-size:30px;font-weight:900;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}.kpi small{color:var(--muted);font-size:12px}.kpi small.up{color:var(--ok)}.kpi small.down{color:var(--ko)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chart{display:flex;align-items:flex-end;gap:3px;height:190px;padding-top:10px;border-bottom:1px solid var(--line2)}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:0;height:100%;position:relative}
.bar i{display:block;width:100%;background:linear-gradient(180deg,var(--or2),var(--or));border-radius:4px 4px 0 0;min-height:2px}
.bar i.u{position:absolute;bottom:0;left:22%;width:56%;background:var(--y);opacity:.9;border-radius:3px 3px 0 0}
.bar:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line2);padding:4px 7px;border-radius:7px;font-size:11px;white-space:nowrap;z-index:3}
.axis{display:flex;gap:3px;font-size:10px;color:var(--muted);margin-top:4px}.axis span{flex:1;text-align:center;min-width:0;overflow:hidden}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.hrs{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:110px;border-bottom:1px solid var(--line2)}.hrs i{background:var(--or);border-radius:3px 3px 0 0;min-height:2px;display:block}
.hrax{display:grid;grid-template-columns:repeat(24,1fr);font-size:9px;color:var(--muted);text-align:center;margin-top:3px}
.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;font-size:14px}.row .track{height:10px;background:var(--s2);border-radius:6px;overflow:hidden}.row .track i{display:block;height:100%;background:var(--or);border-radius:6px}.row b{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
td small{color:var(--muted)}.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--s2);color:var(--muted)}.tag.ok{background:rgba(61,220,132,.14);color:var(--ok)}.tag.ko{background:rgba(255,107,107,.14);color:var(--ko)}
.btn{background:var(--s2);border:1px solid var(--line2);color:var(--fg);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:700;font-size:13px}.btn.pri{background:var(--or);border-color:var(--or);color:#111}.btn.red{border-color:rgba(255,107,107,.5);color:var(--ko)}.btn:disabled{opacity:.5;cursor:default}
.msg{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.msg b{color:var(--or2)}.msg small{color:var(--muted);display:block;font-size:12px}.msg .acts{display:flex;gap:6px;align-items:start}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.links a{display:block;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--fg)}.links a b{display:block}.links a small{color:var(--muted)}
.login{max-width:420px;margin:60px auto;text-align:center;display:grid;gap:14px}.login input{width:100%;background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:12px;color:var(--fg);font-size:16px}
.err{color:var(--ko);font-weight:700}.empty{color:var(--muted);text-align:center;padding:20px}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.tbar input{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;color:var(--fg)}
.scroll{overflow-x:auto}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.kpi b{font-size:24px}.row{grid-template-columns:96px 1fr 44px}th:nth-child(3),td:nth-child(3){display:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="brand" href="./"><em>Zona</em> Pronostici<small>PANNELLO DI GESTIONE</small></a>
<nav class="tabs" id="tabs" hidden><button data-t="visite" aria-pressed="true">📈 Visite</button><button data-t="utenti" aria-pressed="false">👤 Utenti</button><button data-t="chat" aria-pressed="false">💬 Chat</button><button data-t="sfida" aria-pressed="false">🏆 Sfida e schedine</button><button data-t="strumenti" aria-pressed="false">🛠 Strumenti</button><button id="logout" aria-pressed="false">Esci</button></nav></div></header>
<main id="app"><div class="empty">Caricamento…</div></main>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js" integrity="sha384-AQ3POAMqIhwS81FrUH95ekxqBZHeP5tG2JfEL3+7GuTtfRLWnrRh32UxwzM+//A9" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js" integrity="sha384-TnlRYaR4JYz/lpaGuaiU61PjNberSA4vjLjtF+oRC/IkohkJqnWxw5EmDSOt1vA1" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js" integrity="sha384-qn4Jh88HhJA8dplNQyGjOh9OGI4izVhrfj/qIFgaKcdgOE06pXqIKGlsCILZcLAC" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyB3KplhVHW85skZoi9YxiCHeFLJdTAGR_8",authDomain:"zonapronostici-bf68d.firebaseapp.com",projectId:"zonapronostici-bf68d",appId:"1:380390817076:web:a32ea38f6a3d69a6dbb961"});
const auth=firebase.auth(),db=firebase.firestore();const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const romeDay=(off=0)=>new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Rome",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(Date.now()+off*864e5));
const fmtD=d=>{const [y,m,g]=d.split("-");return `${g}/${m}`};
const nf=n=>Number(n||0).toLocaleString("it-IT");
const ts=x=>x&&x.toDate?x.toDate():x?new Date(x):null;
const fdt=x=>{const d=ts(x);return d?d.toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"–"};
let tab="visite",STATS=null,USERS=null;
function login(err){$("#tabs").hidden=true;$("#app").innerHTML=`<div class="login card"><h2>Pannello di gestione</h2><p class="sub">Accedi con l'account amministratore di Zona Pronostici.</p>
 ${err?`<div class="err">${esc(err)}</div>`:""}<button class="btn pri" id="g">Accedi con Google</button><p class="sub" style="margin-top:10px">Per sicurezza il pannello si apre solo con l'account Google amministratore (attiva la verifica in due passaggi su Google).</p></div>`;
 $("#g").onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>login("Accesso non riuscito: "+e.code));
}
auth.onAuthStateChanged(async u=>{if(!u)return login();
 if(!u.providerData.some(p=>p.providerId==="google.com")){await auth.signOut();return login("Usa l'accesso con Google.")}
 try{await db.collection("stats").doc(romeDay()).get()}catch(e){return login(`L'account ${u.email} non è autorizzato a vedere il pannello.`)}
 $("#tabs").hidden=false;render()});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="logout"){auth.signOut();return}tab=b.dataset.t;document.querySelectorAll("#tabs button[data-t]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
async function render(){const app=$("#app");app.innerHTML=`<div class="empty">Caricamento…</div>`;
 try{if(tab==="visite")await renderVisite();else if(tab==="utenti")await renderUtenti();else if(tab==="chat")await renderChat();else if(tab==="sfida")await renderSfida();else renderStrumenti()}
 catch(e){console.error(e);app.innerHTML=`<div class="card err">Errore nel caricare i dati: ${esc(e.message||e)}</div>`}}
/* ---------- VISITE ---------- */
async function loadStats(){const days=[...Array(30)].map((_,i)=>romeDay(i-29));
 const snaps=await db.collection("stats").where(firebase.firestore.FieldPath.documentId(),">=",days[0]).get();
 const m={};snaps.forEach(d=>m[d.id]=d.data());STATS=days.map(d=>({d,...(m[d]||{})}));return STATS}
const sum=(arr,k)=>arr.reduce((s,x)=>s+(x[k]||0),0);
function delta(a,b){if(!b)return a?`<small class="up">nuovo</small>`:"<small>&nbsp;</small>";const p=Math.round((a-b)/b*100);return `<small class="${p>=0?"up":"down"}">${p>=0?"▲":"▼"} ${Math.abs(p)}% rispetto a prima</small>`}
async function renderVisite(){const S=await loadStats();const t=S[29],y=S[28],w=S.slice(23),pw=S.slice(16,23);
 const max=Math.max(1,...S.map(x=>x.pv||0));
 const src=[["Google e motori di ricerca",sum(S,"src_google")],["Social, Telegram, WhatsApp",sum(S,"src_social")],["Diretto o link salvato",sum(S,"src_direct")],["Altri siti",sum(S,"src_other")]];const st=Math.max(1,src.reduce((a,b)=>a+b[1],0));
 const dev=[["Telefono",sum(S,"mob")],["Computer / tablet",sum(S,"desk")]];const dt=Math.max(1,dev[0][1]+dev[1][1]);
 const VN={v_live:"Live",v_fav:"Preferiti e schedine",v_sfida:"Sfida",v_day:"Partite del giorno",v_leagues:"Campionati",v_standings:"Classifica",v_prono:"Pronostici",v_odds:"Quote",v_results:"Risultati"};
 const secs=Object.entries(VN).map(([k,n])=>[n,sum(S,k)]).sort((a,b)=>b[1]-a[1]);const sm=Math.max(1,...secs.map(x=>x[1]));
 const hrs=[...Array(24)].map((_,i)=>sum(w,"h"+String(i).padStart(2,"0")));const hm=Math.max(1,...hrs);
 const rows=(list,tot)=>list.map(([n,v])=>`<div class="row"><span>${esc(n)}</span><span class="track"><i style="width:${v/tot*100}%"></i></span><b>${tot===1&&!v?"0":Math.round(v/tot*100)+"%"}</b></div>`).join("");
 $("#app").innerHTML=`<div><h2>Visite al sito</h2><p class="sub">Dati anonimi raccolti dal sito stesso (niente Google Analytics). "Visitatori" = persone diverse nello stesso giorno; "visualizzazioni" = pagine aperte. Le pagine SEO statiche e i bot non sono contati.</p></div>
 <div class="kpis"><div class="kpi"><span>Visitatori oggi</span><b>${nf(t.uv)}</b>${delta(t.uv||0,y.uv||0).replace("rispetto a prima","vs ieri")}</div>
 <div class="kpi"><span>Visualizzazioni oggi</span><b>${nf(t.pv)}</b>${delta(t.pv||0,y.pv||0).replace("rispetto a prima","vs ieri")}</div>
 <div class="kpi"><span>Visitatori 7 giorni</span><b>${nf(sum(w,"uv"))}</b>${delta(sum(w,"uv"),sum(pw,"uv")).replace("rispetto a prima","vs 7 gg prima")}</div>
 <div class="kpi"><span>Visitatori 30 giorni</span><b>${nf(sum(S,"uv"))}</b><small>${nf(sum(S,"pv"))} visualizzazioni</small></div>
 <div class="kpi"><span>Nuovi iscritti 30 gg</span><b>${nf(sum(S,"ev_reg"))}</b><small>oggi ${nf(t.ev_reg)}</small></div>
 <div class="kpi"><span>Schedine caricate 30 gg</span><b>${nf(sum(S,"ev_slip"))}</b><small>messaggi in chat: ${nf(sum(S,"ev_chat"))}</small></div></div>
 <div class="card"><h3>Ultimi 30 giorni</h3><div class="chart">${S.map(x=>`<div class="bar" data-t="${fmtD(x.d)}: ${nf(x.uv)} visitatori · ${nf(x.pv)} visualizzazioni"><i style="height:${(x.pv||0)/max*100}%"></i><i class="u" style="height:${(x.uv||0)/max*100}%"></i></div>`).join("")}</div>
 <div class="axis">${S.map((x,i)=>`<span>${i%3===2||i===29?fmtD(x.d):""}</span>`).join("")}</div><div class="legend"><span><i style="background:var(--or)"></i>Visualizzazioni</span><span><i style="background:var(--y)"></i>Visitatori</span></div></div>
 <div class="grid2"><div class="card"><h3>Da dove arrivano (30 gg)</h3><div class="rows">${rows(src,st)}</div></div><div class="card"><h3>Dispositivo (30 gg)</h3><div class="rows">${rows(dev,dt)}</div>
  <h3 style="margin-top:18px">Orari di visita (ultimi 7 gg)</h3><div class="hrs">${hrs.map((v,i)=>`<i title="${i}:00 · ${v} visualizzazioni" style="height:${v/hm*100}%"></i>`).join("")}</div><div class="hrax">${hrs.map((_,i)=>`<span>${i%3===0?i:""}</span>`).join("")}</div></div></div>
 <div class="card"><h3>Sezioni più usate (30 gg, aperture)</h3><div class="rows">${secs.map(([n,v])=>`<div class="row"><span>${esc(n)}</span><span class="track"><i style="width:${v/sm*100}%"></i></span><b>${nf(v)}</b></div>`).join("")}</div></div>
 <div class="card scroll"><h3>Dettaglio giorno per giorno</h3><table><tr><th>Giorno</th><th>Visitatori</th><th>Visualizzazioni</th><th>Iscritti</th><th>Schedine</th></tr>${S.slice().reverse().map(x=>`<tr><td>${fmtD(x.d)}</td><td>${nf(x.uv)}</td><td>${nf(x.pv)}</td><td>${nf(x.ev_reg)}</td><td>${nf(x.ev_slip)}</td></tr>`).join("")}</table></div>`}
/* ---------- UTENTI ---------- */
async function renderUtenti(){const q=await db.collection("users").get();USERS=[];q.forEach(d=>USERS.push({id:d.id,...d.data()}));
 USERS.sort((a,b)=>(ts(b.createdAt)||0)-(ts(a.createdAt)||0));const promo=USERS.filter(u=>u.promo);
 const since=d=>USERS.filter(u=>{const c=ts(u.createdAt);return c&&Date.now()-c<d*864e5}).length;
 const bans=new Set();(await db.collection("banned").get()).forEach(d=>bans.add(d.id));
 const draw=f=>{const L=USERS.filter(u=>!f||(u.email||"").toLowerCase().includes(f)||(u.name||"").toLowerCase().includes(f));
  $("#utab").innerHTML=`<tr><th>Nome</th><th>Email</th><th>Registrato</th><th>Ultimo accesso</th><th>Email promo</th><th></th></tr>${L.map(u=>`<tr><td>${esc(u.name||"–")}<br><small>${esc(u.provider==="google.com"?"Google":"Email")}</small></td><td>${esc(u.email)}</td><td>${fdt(u.createdAt)}</td><td>${fdt(u.lastLogin)}</td><td>${u.promo?'<span class="tag ok">Sì</span>':'<span class="tag">No</span>'}</td><td>${bans.has(u.id)?`<button class="btn" data-unban="${u.id}">Sblocca chat</button>`:`<button class="btn red" data-ban="${u.id}" data-n="${esc(u.name||u.email)}">Blocca chat</button>`}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">Nessun utente</td></tr>`}`};
 $("#app").innerHTML=`<div><h2>Utenti registrati</h2><p class="sub">Chi si è registrato sul sito. La colonna "Email promo" indica chi ha dato il consenso a ricevere email: solo a loro puoi scrivere comunicazioni promozionali.</p></div>
 <div class="kpis"><div class="kpi"><span>Utenti totali</span><b>${nf(USERS.length)}</b></div><div class="kpi"><span>Nuovi 7 giorni</span><b>${nf(since(7))}</b><small>oggi ${nf(since(1))}</small></div><div class="kpi"><span>Consenso email</span><b>${nf(promo.length)}</b><small>${USERS.length?Math.round(promo.length/USERS.length*100):0}% degli iscritti</small></div><div class="kpi"><span>Bloccati in chat</span><b>${nf(bans.size)}</b></div></div>
 <div class="card"><div class="tbar"><input id="uf" placeholder="Cerca per nome o email"><button class="btn pri" id="csv" ${promo.length?"":"disabled"}>Scarica email con consenso (CSV)</button></div><div class="scroll"><table id="utab"></table></div></div>`;
 draw("");$("#uf").oninput=e=>draw(e.target.value.trim().toLowerCase());
 $("#csv").onclick=()=>{const rows=[["nome","email","consenso_dal"]].concat(promo.map(u=>[u.name||"",u.email||"",ts(u.promoAt)?ts(u.promoAt).toISOString().slice(0,10):""]));
  const blob=new Blob(["﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="zonapronostici-email-consenso.csv";a.click()};
 $("#utab").onclick=async e=>{const b=e.target.closest("[data-ban],[data-unban]");if(!b)return;b.disabled=true;
  try{if(b.dataset.ban){if(!confirm(`Bloccare ${b.dataset.n} dalla chat? Non potrà più scrivere commenti.`)){b.disabled=false;return}await db.collection("banned").doc(b.dataset.ban).set({at:firebase.firestore.FieldValue.serverTimestamp()})}else await db.collection("banned").doc(b.dataset.unban).delete();renderUtenti()}catch(err){alert("Operazione non riuscita: "+err.message);b.disabled=false}}}
/* ---------- CHAT ---------- */
async function renderChat(){let L=[];let idxErr=null;
 try{const q=await db.collectionGroup("msgs").orderBy("createdAt","desc").limit(100).get();q.forEach(d=>L.push({id:d.id,path:d.ref.path,...d.data()}))}catch(e){idxErr=e}
 const bans=new Set();(await db.collection("banned").get()).forEach(d=>bans.add(d.id));
 $("#app").innerHTML=`<div><h2>Moderazione chat</h2><p class="sub">Gli ultimi 100 messaggi scritti nelle chat delle partite live. Puoi eliminare un messaggio o bloccare chi scrive insulti o spam.</p></div>
 <div class="card">${idxErr?`<div class="err">Per vedere i messaggi serve un indice del database. ${String(idxErr.message).match(/https:\/\/\S+/)?`<a href="${String(idxErr.message).match(/https:\/\/\S+/)[0]}" target="_blank">Crealo con un clic qui</a> e riprova tra qualche minuto.`:esc(idxErr.message)}</div>`:
  L.length?L.map(m=>`<div class="msg"><div><b>${esc(m.name)}</b> ${bans.has(m.uid)?'<span class="tag ko">bloccato</span>':""}<div>${esc(m.text)}</div><small>${fdt(m.createdAt)} · partita ${esc(m.path.split("/")[1])}</small></div><div class="acts"><button class="btn red" data-del="${esc(m.path)}">Elimina</button>${bans.has(m.uid)?"":`<button class="btn" data-ban="${m.uid}" data-n="${esc(m.name)}">Blocca</button>`}</div></div>`).join(""):`<div class="empty">Ancora nessun messaggio in chat.</div>`}</div>`;
 $("#app").onclick=async e=>{const b=e.target.closest("[data-del],[data-ban]");if(!b||tab!=="chat")return;b.disabled=true;
  try{if(b.dataset.del)await db.doc(b.dataset.del).delete();else{if(!confirm(`Bloccare ${b.dataset.n} dalla chat?`)){b.disabled=false;return}await db.collection("banned").doc(b.dataset.ban).set({at:firebase.firestore.FieldValue.serverTimestamp()})}renderChat()}catch(err){alert("Operazione non riuscita: "+err.message);b.disabled=false}}}
/* ---------- SFIDA E SCHEDINE ---------- */
async function renderSfida(){const day=romeDay(),yday=romeDay(-1);
 const [p1,p2,sl]=await Promise.all([db.collection("picks").where("d","==",day).get(),db.collection("picks").where("d","==",yday).get(),db.collection("slips").get().catch(()=>null)]);
 const people=q=>{const s=new Set();q.forEach(d=>s.add(d.data().uid));return s.size};
 const tiers={aff:0,med:0,est:0};p1.forEach(d=>{const k=d.data().k;if(k in tiers)tiers[k]++});
 const slips=[];if(sl)sl.forEach(d=>slips.push(d.data()));const legs=slips.reduce((s,x)=>s+(x.legs||[]).length,0);
 const recent=slips.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,15);
 $("#app").innerHTML=`<div><h2>Sfida del giorno e schedine</h2><p class="sub">Quante persone giocano alla Sfida (gratis, senza premi) e quante schedine vengono caricate dagli utenti registrati.</p></div>
 <div class="kpis"><div class="kpi"><span>Giocatori Sfida oggi</span><b>${nf(people(p1))}</b><small>${nf(p1.size)} scelte</small></div><div class="kpi"><span>Giocatori Sfida ieri</span><b>${nf(people(p2))}</b><small>${nf(p2.size)} scelte</small></div>
 <div class="kpi"><span>Scelte di oggi</span><b>${nf(p1.size)}</b><small>Affidabile ${tiers.aff} · Medio ${tiers.med} · Estremo ${tiers.est}</small></div>
 <div class="kpi"><span>Schedine salvate sugli account</span><b>${nf(slips.length)}</b><small>${nf(legs)} eventi in totale</small></div></div>
 <div class="card scroll"><h3>Ultime schedine caricate</h3>${recent.length?`<table><tr><th>Data</th><th>Eventi</th><th>Partite</th></tr>${recent.map(s=>`<tr><td>${fdt(s.createdAt)}</td><td>${(s.legs||[]).length}</td><td><small>${(s.legs||[]).slice(0,4).map(l=>esc(l.h+"-"+l.a+" ("+l.mk+")")).join(" · ")}${(s.legs||[]).length>4?" …":""}</small></td></tr>`).join("")}</table>`:`<div class="empty">Ancora nessuna schedina salvata su un account. (Quelle di chi non è registrato restano solo sul suo telefono.)</div>`}</div>`}
